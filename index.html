<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SyWavy | Rapper and Producer from St. Petersburg, FL</title>
  <meta name="description" content="Official site of SyWavy, rapper and producer from Saint Petersburg, Florida. Stream the new album Magnum Opus, browse the full discography, and watch every music video." />
  <link rel="canonical" href="https://sywavy.com/" />
  <meta name="theme-color" content="#08090b" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SyWavy" />
  <meta property="og:title" content="SyWavy" />
  <meta property="og:description" content="Rapper and producer from Saint Petersburg, Florida. New album Magnum Opus out now." />
  <meta property="og:url" content="https://sywavy.com/" />
  <meta property="og:image" content="https://sywavy.com/assets/photos/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SyWavy" />
  <meta name="twitter:description" content="Rapper and producer from Saint Petersburg, Florida. New album Magnum Opus out now." />
  <meta name="twitter:image" content="https://sywavy.com/assets/photos/og.jpg" />

  <link rel="icon" type="image/png" sizes="96x96" href="/assets/photos/logo-96.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/photos/logo-180.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script>document.documentElement.classList.add('js')</script>

  <!-- build.js adds the structured data and writes each section's text into the page -->
</head>
<body>

  <!-- WAVES (waves.js draws them) -->
  <div id="waveBg" aria-hidden="true">
    <div id="waveDepth"></div>
    <canvas id="waves"></canvas>
  </div>

  <a href="#music" class="skip-link">Skip to the music</a>

  <!-- NAV -->
  <nav id="nav" aria-label="Main navigation">
    <a href="#" class="nav-wordmark" aria-label="SyWavy home">
      <img src="/assets/photos/logo-96.png" alt="" class="nav-logo" width="96" height="96" />
      <span class="nav-wordmark-text">SyWavy</span>
    </a>

    <ul class="nav-links" id="navMenu">
      <li><a href="#music" class="nav-link">Music</a></li>
      <li><a href="#videos" class="nav-link">Videos</a></li>
      <li><a href="#about" class="nav-link">About</a></li>
      <li><a href="#contact" class="nav-link">Contact</a></li>
    </ul>

    <div class="nav-end">
      <a href="#music" class="nav-cta">Listen</a>
      <button class="nav-hamburger" id="navHamburger" aria-label="Open menu" aria-expanded="false" aria-controls="navMenu">
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <main>

    <!-- HERO -->
    <section id="hero" aria-label="Intro">
      <!-- On wide screens the beach behind him fades into the page, so the waves can carry the sea on -->
      <picture class="hero-photo" aria-hidden="true">
        <source
          media="(min-width: 900px)"
          srcset="/assets/photos/sywavy-hero-1000.webp 1000w, /assets/photos/sywavy-hero-1600.webp 1600w, /assets/photos/sywavy-hero-2200.webp 2200w"
          sizes="64vw"
        />
        <img
          src="/assets/photos/sywavy-portrait-800.webp"
          srcset="/assets/photos/sywavy-portrait-800.webp 800w, /assets/photos/sywavy-portrait-1400.webp 1400w, /assets/photos/sywavy-portrait-2000.webp 2000w"
          sizes="100vw"
          alt=""
          width="800"
          height="1200"
          fetchpriority="high"
          decoding="async"
        />
      </picture>
      <div class="hero-shade" aria-hidden="true"></div>
      <div class="container hero-inner">
        <div class="hero-title">
          <p id="heroDescriptor" class="hero-descriptor"></p>
          <h1 id="heroName" class="hero-name"></h1>
        </div>
        <a href="#music" id="heroRelease" class="hero-release"></a>
      </div>
    </section>

    <!-- LATEST RELEASE -->
    <section id="music" aria-labelledby="featuredTitle">
      <div class="container">
        <div id="featuredRelease" class="featured-release animate-on-scroll"></div>
      </div>
    </section>

    <!-- DISCOGRAPHY -->
    <section id="discography" aria-labelledby="discographyHeading">
      <div class="container">
        <div class="section-head">
          <h2 id="discographyHeading" class="section-heading">Discography<span id="releaseCount" class="section-count"></span></h2>
          <div class="filter-tabs" role="group" aria-label="Filter releases">
            <button class="filter-btn" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-btn" data-filter="album" aria-pressed="false">Albums</button>
            <button class="filter-btn" data-filter="ep" aria-pressed="false">EPs</button>
            <button class="filter-btn" data-filter="single" aria-pressed="false">Singles</button>
          </div>
        </div>
        <div id="discographyGrid" class="discography-grid"></div>
        <div class="show-more-wrap">
          <button id="releasesMore" class="btn-outline" type="button" hidden>Show all releases</button>
        </div>
      </div>
    </section>

    <!-- VIDEOS -->
    <section id="videos" aria-labelledby="videosHeading">
      <div class="container">
        <div class="section-head">
          <h2 id="videosHeading" class="section-heading">Videos<span id="videoCount" class="section-count"></span></h2>
        </div>
        <div id="videosGrid" class="videos-grid"></div>
        <div class="show-more-wrap">
          <button id="videosMore" class="btn-outline" type="button" hidden>Show all videos</button>
        </div>
      </div>
    </section>

    <!-- ABOUT -->
    <section id="about" aria-labelledby="aboutHeading">
      <div class="container">
        <div class="section-head">
          <h2 id="aboutHeading" class="section-heading">About</h2>
        </div>
        <div class="about-photo-wrap animate-on-scroll">
          <picture>
            <source
              media="(min-width: 800px)"
              srcset="/assets/photos/sywavy-studio-wide-1280.webp 1280w, /assets/photos/sywavy-studio-wide-2000.webp 2000w"
              sizes="(min-width: 1440px) 1220px, 92vw"
              width="1280"
              height="720"
            />
            <img
              src="/assets/photos/sywavy-studio-800.webp"
              srcset="/assets/photos/sywavy-studio-800.webp 800w, /assets/photos/sywavy-studio-1200.webp 1200w"
              sizes="92vw"
              alt="SyWavy, on the right, posing in front of a white backdrop"
              class="about-photo"
              width="800"
              height="640"
              loading="lazy"
              decoding="async"
            />
          </picture>
        </div>
        <div class="about-layout">
          <div id="aboutBio" class="about-bio animate-on-scroll"></div>
          <div class="about-side animate-on-scroll">
            <dl id="aboutFacts" class="about-facts"></dl>
            <p class="about-follow-label">Follow SyWavy</p>
            <div id="aboutSocials" class="follow-links"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" aria-labelledby="contactHeading">
      <div class="container">
        <div class="contact-layout animate-on-scroll">
          <div class="contact-intro">
            <h2 id="contactHeading" class="section-heading">Contact</h2>
            <p class="contact-sub">Bookings, features, and collaborations.</p>
            <p class="contact-direct">
              <span>Write directly to</span>
              <a id="contactEmail" href="#" class="contact-email"></a>
            </p>
          </div>

          <form id="contactForm" class="contact-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label for="formName">Name</label>
                <input type="text" id="formName" name="name" autocomplete="name" required />
              </div>
              <div class="form-group">
                <label for="formEmail">Email</label>
                <input type="email" id="formEmail" name="email" autocomplete="email" required />
              </div>
            </div>
            <div class="form-group">
              <label for="formMessage">Message</label>
              <textarea id="formMessage" name="message" rows="5" required></textarea>
            </div>
            <div class="form-submit">
              <button type="submit" class="btn-primary">Send message</button>
              <p class="form-note">Opens your email app with the message filled in.</p>
            </div>
            <div id="formFeedback" class="form-feedback" aria-live="polite"></div>
          </form>
        </div>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer id="footer">
    <div class="container footer-inner">
      <a href="#" class="footer-brand" aria-label="Back to the top">
        <img src="/assets/photos/logo-96.png" alt="" width="96" height="96" loading="lazy" />
        <span>SyWavy</span>
      </a>
      <ul class="footer-links">
        <li><a href="#music">Music</a></li>
        <li><a href="#videos">Videos</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <div id="footerSocials" class="footer-socials"></div>
      <p class="footer-copy" id="footerCopy"></p>
    </div>
  </footer>

  <script src="/data.js"></script>
  <script src="/render.js"></script>
  <script src="/waves.js"></script>
  <script src="/main.js"></script>
</body>
</html>
